<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notebook · 开发预览（模拟数据）</title>
  <style>
    html, body, #app { margin: 0; height: 100%; background: #050506; }
    body { display: flex; flex-direction: column; }
    .devbar {
      flex: none;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      padding: 8px 12px;
      background: #161618;
      color: #d6d6dc;
      font: 12px/1.4 ui-monospace, monospace;
    }
    .devbar a { color: #9eb6ff; }
    body.clean .devbar { display: none; }
    #app { flex: 1; min-height: 0; }
    .host-button {
      background: #5c2b2b;
      color: #fff;
      border: 3px solid #ffd36a;
      padding: 4px 8px;
    }
  </style>
</head>
<body>
  <!-- Dev-only harness. Not injected by the plugin and not listed in package.json "files". -->
  <div class="devbar">
    <span>开发预览 · 模拟数据 / 无模型调用</span>
    <a href="?scene=ready">工作台</a>
    <a href="?scene=empty">空来源</a>
    <a href="?scene=fresh">首次使用</a>
    <a href="?scene=nosession">无宿主会话</a>
    <a href="?scene=empty-models">无模型</a>
    <a href="?scene=chat-error">模拟失败</a>
    <a href="?scene=slow">取消任务</a>
    <a href="?scene=error">接口错误</a>
    <a href="?scene=loading">加载中</a>
    <button class="host-button" type="button">host button</button>
  </div>
  <div id="app"></div>
  <script src="harness.js"></script>
  <script src="../src/client.js"></script>
  <script src="boot.js"></script>
</body>
</html>
